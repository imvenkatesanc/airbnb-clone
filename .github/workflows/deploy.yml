name: Build and Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: airbnbcloneacr
  RESOURCE_GROUP: airbnb-clone-rg
  BACKEND_APP_NAME: airbnb-clone-backend
  FRONTEND_APP_NAME: airbnb-clone-frontend

jobs:
  # ─────────────────────────────────────────
  # Job 1: Build & Push images to ACR
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push backend image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/airbnb-backend:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/airbnb-backend:latest \
            -f api/Dockerfile.backend \
            ./api
          docker push ${{ env.ACR_NAME }}.azurecr.io/airbnb-backend:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/airbnb-backend:latest

      - name: Build & push frontend image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/airbnb-frontend:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/airbnb-frontend:latest \
            -f client/Dockerfile.frontend \
            --build-arg VITE_BASE_URL=${{ secrets.VITE_BASE_URL }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            ./client
          docker push ${{ env.ACR_NAME }}.azurecr.io/airbnb-frontend:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/airbnb-frontend:latest

  # ─────────────────────────────────────────
  # Job 2: Deploy to Azure App Service
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.BACKEND_APP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/airbnb-backend:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/airbnb-frontend:${{ needs.build-and-push.outputs.image_tag }}

      - name: Logout from Azure
        run: az logout